name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Prepare CI artifacts
        if: always()
        run: mkdir -p ci-artifacts

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          FORCE_COLOR=0 npm run lint 2>&1 | tee ci-artifacts/lint.log

      - name: TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          FORCE_COLOR=0 npm run typecheck 2>&1 | tee ci-artifacts/typecheck.log

      - name: Tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          FORCE_COLOR=0 npm run test:ci -- --json --outputFile=ci-artifacts/jest-results.json 2>&1 | tee ci-artifacts/tests.log

      - name: Publish CI summary
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "⚪ Cancelled" ;;
              *) echo "⚪ $1" ;;
            esac
          }

          {
            echo "# MuscleMetric CI Report"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Dependency install | $(icon "$INSTALL_OUTCOME") |"
            echo "| ESLint | $(icon "$LINT_OUTCOME") |"
            echo "| TypeScript | $(icon "$TYPECHECK_OUTCOME") |"
            echo "| Jest | $(icon "$TEST_OUTCOME") |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f ci-artifacts/lint.log ]; then
            LINT_TOTAL=$(grep -E "✖ [0-9]+ problems" ci-artifacts/lint.log | tail -1 || true)
            if [ -n "$LINT_TOTAL" ]; then
              {
                echo "## ESLint"
                echo
                echo "`$LINT_TOTAL`"
                echo
                echo "GitHub annotations above identify the exact files and lines. The full lint output is also attached as a CI artifact."
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ -f ci-artifacts/jest-results.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("ci-artifacts/jest-results.json")
          try:
              data = json.loads(path.read_text())
          except Exception:
              raise SystemExit(0)

          total = data.get("numTotalTests", 0)
          passed = data.get("numPassedTests", 0)
          failed = data.get("numFailedTests", 0)
          pending = data.get("numPendingTests", 0)
          suites = data.get("numTotalTestSuites", 0)

          print("## Jest")
          print()
          print(f"- **Suites:** {suites}")
          print(f"- **Tests:** {total}")
          print(f"- **Passed:** {passed}")
          print(f"- **Failed:** {failed}")
          print(f"- **Skipped:** {pending}")
          print()
          PY
          fi

          {
            echo "## Artifacts"
            echo
            echo "The workflow retains the full lint, TypeScript and Jest logs plus Jest's machine-readable JSON result for failed runs."
            echo
            echo "_Allure can be layered onto the Jest results later for richer test history and visual reporting once the baseline CI is green._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce CI gate
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ] || \
             [ "$LINT_OUTCOME" != "success" ] || \
             [ "$TYPECHECK_OUTCOME" != "success" ] || \
             [ "$TEST_OUTCOME" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi

          echo "All required CI checks passed."
